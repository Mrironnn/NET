<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NET</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --panel: #141414;
            --accent: #0078d4;
            --text: #e0e0e0;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            height: 100dvh;
            overflow: hidden;
            flex-direction: column;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .auth-box {
            background: var(--panel);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #333;
            width: 320px;
            text-align: center;
        }

        #main-app {
            display: none;
            width: 100%;
            height: 100%;
        }

        .sidebar {
            width: 300px;
            background: var(--panel);
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            overflow-y: auto; /* Включаем вертикальную прокрутку */
        }

            /* Прячем уродливый стандартный ползунок прокрутки для красоты (в WebKit браузерах) */
            .sidebar::-webkit-scrollbar {
                width: 0px;
                background: transparent;
            }

        .chat-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background: #080808;
            visibility: hidden;
            height: 100dvh;
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid #222;
            font-weight: bold;
            font-size: 1.1em;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .my-profile-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 8px;
            transition: 0.2s;
        }

            .my-profile-btn:hover {
                background: #222;
            }

        .net-logo {
            font-size: 1.5em;
            font-weight: 900;
            color: white;
            margin-bottom: 20px;
        }

            .net-logo span {
                color: var(--accent);
            }

        #messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            list-style: none;
            display: flex;
            flex-direction: column;
            margin: 0;
        }

        .msg-container {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            margin-bottom: 8px;
            max-width: 75%;
        }

            .msg-container.my-msg-container {
                align-self: flex-end;
                flex-direction: row-reverse;
            }

        .msg {
            background: #1a1a1a;
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid #222;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            word-break: break-word;
            white-space: pre-wrap;
            width: fit-content; /* Облегает короткий текст */
            max-width: 100%; /* Защищает от вылезания за края */
            box-sizing: border-box;
        }

        .my-msg {
            border-right: 3px solid var(--accent);
            background: #1e1e1e;
        }

        .input-box {
            padding: 20px;
            background: var(--panel);
            display: flex;
            gap: 10px;
            border-top: 1px solid #222;
            align-items: center;
            flex-shrink: 0;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }

        input[type="text"], input[type="email"], input[type="password"], textarea {
            background: #222;
            border: 1px solid #333;
            color: white;
            padding: 12px;
            border-radius: 8px;
            flex-grow: 1;
            outline: none;
            box-sizing: border-box;
            font-family: inherit;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

            button:hover {
                background: #005a9e;
            }

        .user-item {
            padding: 15px;
            border-bottom: 1px solid #222;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

            .user-item:hover {
                background: #1e1e1e;
            }

        .avatar-img, .avatar-circle {
            border-radius: 50%;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
            background: #333;
            cursor: pointer;
        }

        .sz-sm {
            width: 35px;
            height: 35px;
            font-size: 0.9em;
        }

        .sz-md {
            width: 50px;
            height: 50px;
            font-size: 1.2em;
        }

        .sz-lg {
            width: 120px;
            height: 120px;
            font-size: 2.5em;
            border: 3px solid #222;
        }

        .reg-avatar-upload {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #222;
            margin: 0 auto 20px auto;
            border: 2px dashed #555;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

            .reg-avatar-upload:hover {
                border-color: var(--accent);
            }

        .reg-avatar-text {
            font-size: 0.8em;
            color: #888;
        }

        .reg-avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            display: none;
        }

        .code-section {
            padding: 15px;
            border-bottom: 1px solid #222;
            background: #0f0f0f;
        }

        .code-display {
            font-size: 1.2em;
            color: var(--accent);
            font-weight: bold;
            letter-spacing: 2px;
        }

        .profile-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 500;
            opacity: 0;
            transition: opacity 0.3s;
        }

            .profile-modal.show {
                display: flex;
                opacity: 1;
            }

        .profile-card {
            background: var(--panel);
            width: 320px;
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
        }

        .profile-name {
            margin: 15px 0 5px 0;
            font-size: 1.5em;
        }

        .profile-desc {
            color: #aaa;
            font-size: 0.95em;
            min-height: 40px;
            word-wrap: break-word;
        }

        .profile-desc-edit {
            display: none;
            width: 100%;
            resize: none;
            height: 80px;
            margin-top: 10px;
        }

        .edit-controls {
            margin-top: 15px;
            display: none;
            gap: 10px;
            justify-content: center;
        }

        .edit-avatar-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--accent);
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            cursor: pointer;
            border: 2px solid var(--panel);
        }

        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }

        .toast {
            background: var(--panel);
            border-left: 4px solid var(--accent);
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s ease;
            min-width: 200px;
            max-width: 300px;
            word-wrap: break-word;
        }

            .toast.show {
                opacity: 1;
                transform: translateY(0);
            }

        .back-btn {
            display: none;
            cursor: pointer;
            margin-right: 15px;
            font-size: 1.2em;
        }

        /* ИСПРАВЛЕННАЯ МОБИЛЬНАЯ ВЕРСИЯ */
        @media (max-width: 768px) {
            #main-app {
                position: relative;
            }

            .sidebar {
                width: 100%;
                border-right: none;
            }

            .chat-area {
                position: fixed; /* Fixed решает проблему с высотой в Яндексе */
                top: 0;
                left: 0;
                width: 100vw;
                height: 100dvh;
                z-index: 10;
                background: var(--bg);
            }

            .back-btn {
                display: inline-block;
            }

            #toast-container {
                bottom: auto;
                top: 10px;
                right: 10px;
                left: 10px;
            }

            .toast {
                max-width: unset;
                width: calc(100% - 40px);
            }

            .auth-box {
                width: 85%;
            }
        }

        /* --- СТАТУСЫ ОНЛАЙН --- */
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            vertical-align: middle;
            transition: 0.3s ease;
            flex-shrink: 0;
        }

        .status-online {
            background-color: #4CAF50; /* Зеленый цвет для онлайна */
            box-shadow: 0 0 5px #4CAF50;
        }

        .status-offline {
            background-color: #666; /* Серый для оффлайна */
        }

        /* --- ОТВЕТЫ НА СООБЩЕНИЯ --- */
        .msg {
            position: relative;
        }
        /* Нужно для привязки точки */
        .msg-dot {
            position: absolute;
            bottom: -5px;
            width: 16px;
            height: 16px;
            background: var(--panel);
            border: 1px solid #333;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #fff;
            opacity: 0;
            transition: 0.2s ease;
            user-select: none;
        }

        .msg:hover .msg-dot {
            opacity: 1;
        }

        .my-msg .msg-dot {
            left: -20px;
        }

        .msg:not(.my-msg) .msg-dot {
            right: -20px;
        }

        #msg-context-menu {
            position: fixed;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 5px 0;
            display: none;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            min-width: 120px;
        }
        .msg-menu-item {
            padding: 10px 15px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text);
            transition: background 0.2s;
        }

            .msg-menu-item:hover {
                background: #333;
            }

        #reply-preview-bar {
            display: none;
            background: #141414;
            border-left: 3px solid var(--accent);
            padding: 10px 15px;
            justify-content: space-between;
            align-items: center;
            border-radius: 8px 8px 0 0;
            margin-bottom: -20px; /* Сливаемся с input-box */
            z-index: 1;
            position: relative;
        }

        .replied-msg-box {
            background: rgba(0, 0, 0, 0.25);
            border-left: 3px solid var(--accent);
            padding: 6px 10px;
            margin-bottom: 6px;
            border-radius: 4px;
            font-size: 0.85em;
            color: #ccc;
        }

        .unread-icon {
            color: var(--accent);
            font-weight: bold;
            font-size: 18px;
            margin-left: auto;
            display: none;
        }

            .unread-icon.visible {
                display: inline-block;
            }

        /* Стили для вкладок профиля/друзей */
        .profile-tabs {
            display: flex;
            border-bottom: 1px solid #333;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            transition: 0.2s;
            font-size: 16px;
            outline: none;
        }

            .tab-btn.active {
                color: var(--accent);
                border-bottom: 2px solid var(--accent);
                font-weight: bold;
            }

        #tab-friends {
            display: none;
        }
        /* Скрыто по умолчанию */
        #requests-list {
            max-height: 250px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .req-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #333;
        }

        .req-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .req-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .req-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            transition: 0.2s;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

            .req-btn:hover {
                transform: scale(1.2);
            }

        .req-accept {
            color: #4CAF50;
        }

        .req-reject {
            color: #f44336;
        }

        /* Компактные фото в чате */
        .chat-img {
            max-width: 220px;
            max-height: 250px;
            border-radius: 8px;
            display: block;
            cursor: pointer;
            object-fit: cover;
            margin-top: 5px;
            transition: opacity 0.2s;
        }

            .chat-img:hover {
                opacity: 0.8;
            }

        /* Полноэкранный просмотр фото */
        #photo-viewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

            #photo-viewer img {
                max-width: 90vw;
                max-height: 90vh;
                border-radius: 8px;
                object-fit: contain;
                cursor: pointer;
            }

        /* Реакции */
        .reactions-bar {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 2px;
        }

        .react-badge {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 2px 6px;
            font-size: 11px;
            cursor: pointer;
            border: 1px solid transparent;
            user-select: none;
        }

            .react-badge.my-react {
                background: rgba(0, 120, 212, 0.3);
                border-color: var(--accent);
            }

        #emoji-picker span {
            transition: transform 0.1s;
        }

            #emoji-picker span:hover {
                transform: scale(1.3);
            }
    </style>
</head>
<body>
    <div id="toast-container"></div>
    <div id="auth-modal" class="modal">
        <div class="auth-box">
            <div class="net-logo">N<span>E</span>T</div>
            <h2 id="auth-title">Вход</h2>
            <input type="email" id="email" placeholder="Email"><br><br>
            <input type="password" id="pass" placeholder="Пароль"><br><br>
            <button onclick="handleAuth()" id="auth-btn" style="width:100%">Войти</button>
            <p style="font-size: 0.8em; margin-top: 15px; cursor: pointer; color: #888;" onclick="toggleAuth()">Нет аккаунта? Регистрация</p>
        </div>
    </div>
    <div id="name-modal" class="modal" style="display: none;">
        <div class="auth-box">
            <h2>Создание профиля</h2>
            <div class="reg-avatar-upload" onclick="document.getElementById('reg-avatar-input').click()">
                <span class="reg-avatar-text">+ Фото</span>
                <img id="reg-avatar-preview" class="reg-avatar-img">
            </div>
            <input type="file" id="reg-avatar-input" style="display:none" onchange="previewRegAvatar()" accept="image/*">
            <input type="text" id="new-name" placeholder="Твой ник"><br><br>
            <button onclick="saveInitProfile()" style="width:100%">Начать</button>
        </div>
    </div>
    <div id="profile-modal" class="profile-modal" onclick="closeProfile(event)">
        <div class="profile-card" onclick="event.stopPropagation()" style="width: 350px;">
            <div class="profile-tabs">
                <button id="btn-tab-profile" class="tab-btn active" onclick="switchTab('profile')">Профиль</button>
                <button id="btn-tab-friends" class="tab-btn" onclick="switchTab('friends')">Друзья <span id="req-badge" style="display:none; background:red; color:white; border-radius:50%; padding:2px 6px; font-size:12px; margin-left:5px;">0</span></button>
            </div>
            <div id="tab-profile">
                <div style="position: relative; display: inline-block;">
                    <div id="profile-avatar-container"></div>
                    <div id="edit-avatar-btn" class="edit-avatar-badge" onclick="document.getElementById('prof-avatar-input').click()"> 📷 </div>
                    <input type="file" id="prof-avatar-input" style="display:none" onchange="updateProfileAvatar()" accept="image/*">
                </div>
                <h2 id="profile-name" class="profile-name">Имя</h2>
                <div id="profile-desc-display" class="profile-desc"></div>
                <textarea id="profile-desc-input" class="profile-desc-edit" placeholder="Напишите немного о себе..."></textarea>
                <div style="margin-top: 15px; color: var(--accent); font-weight: bold; user-select: text;">Мой код: <span id="profile-code-display"></span></div>
                <div id="profile-edit-controls" class="edit-controls">
                    <button onclick="toggleEditMode()" style="background:#333;">Отмена</button>
                    <button onclick="saveProfileChanges()">Сохранить</button>
                </div>
                <button id="profile-start-edit-btn" onclick="toggleEditMode()" style="margin-top:15px; width:100%; display:none;">Редактировать описание</button>
            </div>
            <div id="tab-friends">
                <div id="requests-list">
                </div>
            </div>
        </div>
    </div>
    <div id="main-app">
        <div class="sidebar">
            <div class="header">
                <span class="net-logo" style="margin:0; font-size:1.2em;">N<span>E</span>T</span>
                <div class="my-profile-btn" onclick="openProfile(myId)">
                    <span id="my-name-display" style="font-size: 0.9em; font-weight: normal;">...</span>
                    <div id="my-avatar-display"></div>
                </div>
            </div>
            <div class="code-section">
                Ваш код: <span class="code-display" id="my-code-display">...</span>
                <div style="display:flex; gap:5px; margin-top:10px;">
                    <input type="text" id="friend-code" placeholder="Код друга" maxlength="6" style="margin-bottom:0">
                    <button onclick="addFriend()">+</button>
                </div>
            </div>
            <div id="user-list"></div>
        </div>
        <div class="chat-area" id="chat-area">
            <div class="header" id="chat-with">Чат</div>
            <div id="messages"></div>
            <div id="reply-preview-bar">
                <div style="overflow: hidden; padding-right: 10px;">
                    <div style="color: var(--accent); font-size: 12px; font-weight: bold; margin-bottom: 2px;">Ответ</div>
                    <div id="reply-preview-text" style="font-size: 13px; color: #aaa; white-space: nowrap; text-overflow: ellipsis; overflow: hidden;"></div>
                </div>
                <div onclick="cancelReply()" style="cursor: pointer; padding: 5px; color: #888;">✖</div>
            </div>
            <div class="input-box">
                <input type="file" id="file-input" style="display:none" onchange="uploadPhotoMsg()" accept="image/*">
                <button onclick="document.getElementById('file-input').click()" style="background: #333; padding: 10px 15px;"> 📎 </button>
                <input type="text" id="msg-input" placeholder="Сообщение...">
                <button onclick="send()" style="padding: 10px 20px;">Отправить</button>
            </div>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let unreadCounts = {};

        function updateUnreadUI(userId) {
            const icon = document.getElementById(`unread-${userId}`);
            if (icon) {
                if (unreadCounts[userId] > 0) icon.classList.add('visible');
                else icon.classList.remove('visible');
            }
        }

        const messageObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting && entry.target.classList.contains('unread-msg')) {
                    const msgNode = entry.target;
                    const msgId = msgNode.dataset.msgId;
                    const senderId = msgNode.dataset.senderId;

                    msgNode.classList.remove('unread-msg'); // Убираем класс, чтобы не считывать дважды
                    if (msgId) socket.emit('mark_read', msgId); // Говорим серверу, что прочитано

                    if (unreadCounts[senderId] > 0) {
                        unreadCounts[senderId]--;
                        updateUnreadUI(senderId); // Обновляем восклицательный знак
                    }
                }
            });
        }, { root: document.getElementById('messages'), threshold: 0.5 });
        let myId, myName, myCode, currentChatId = null;
        let myAvatar = '';
        let myDescription = '';
        let tempRegAvatarUrl = '';
        let contactsMap = {};
        let currentProfileEditId = null;
        let isEditingProfile = false;
        let onlineUsersSet = new Set(); // Список тех, кто онлайн
        // НОВЫЕ ПЕРЕМЕННЫЕ ДЛЯ ОТВЕТОВ
        window.currentReplyText = null;
        window.selectedTextForMenu = "";

        function updateStatusUI(userId, status) {
            const idStr = String(userId);
            if (status === 'online') onlineUsersSet.add(idStr);
            else onlineUsersSet.delete(idStr);

            // Меняем цвет всех точек этого пользователя
            document.querySelectorAll(`.status-dot[data-userid="${idStr}"]`).forEach(dot => {
                dot.className = `status-dot ${status === 'online' ? 'status-online' : 'status-offline'}`;
            });
        }

        // Вычисление аббревиатуры (до двух букв)
        function getInitials(name) {
            if (!name) return 'U';
            const parts = name.trim().split(/\s+/);
            if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
            return name.charAt(0).toUpperCase();
        }

        function getAvatarHtml(name, avatarUrl, sizeClass, onclickStr = '') {
            if (avatarUrl && avatarUrl.trim() !== '') {
                return `<img src="${avatarUrl}" class="avatar-img ${sizeClass}" ${onclickStr ? `onclick="${onclickStr}"` : ''}>`;
            }
            return `<div class="avatar-circle ${sizeClass}" ${onclickStr ? `onclick="${onclickStr}"` : ''}>${getInitials(name)}</div>`;
        }

        window.onload = async () => {
            // Очищаем старые забагованные сессии
            localStorage.removeItem('net_session');

            // Загружаем только по безопасному токену
            const savedToken = localStorage.getItem('net_session_token');
            if (savedToken) {
                const res = await fetch(`/validate-session?token=${savedToken}`);
                const status = await res.json();
                if (status.valid) {
                    myId = status.user.id;
                    myName = status.user.name;
                    myCode = status.user.code;
                    myAvatar = status.user.avatar || '';
                    myDescription = status.user.description || '';
                    document.getElementById('auth-modal').style.display = 'none';

                    // Если имя пустое или записалось как "null" - принудительно возвращаем на окно создания профиля
                    if (!myName || myName === 'null') {
                        document.getElementById('name-modal').style.display = 'flex';
                    } else {
                        startApp();
                    }
                } else {
                    localStorage.removeItem('net_session_token');
                }
            }
        };

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('pass').value;
            const isReg = document.getElementById('auth-title').innerText === "Регистрация";
            const res = await fetch(isReg ? '/register' : '/login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (res.ok) {
                myId = data.id; myCode = data.code;
                localStorage.setItem('net_session_token', data.token);
                document.getElementById('auth-modal').style.display = 'none';
                if (isReg) {
                    document.getElementById('name-modal').style.display = 'flex';
                } else {
                    myName = data.name; myAvatar = data.avatar || ''; myDescription = data.description || '';
                    startApp();
                }
            } else {
                // Переводчик ошибок от сервера
                let errText = "Ошибка системы";
                if (data.error === 'email_taken') errText = "Этот Email уже занят";
                if (data.error === 'user_not_found') errText = "Пользователь не найден";
                if (data.error === 'wrong_password') errText = "Неверный пароль";
                if (data.error === 'empty_fields') errText = "Заполните все поля!";
                showToast("Внимание", errText);
            }
        }

        async function selectChat(id, name) {
            currentChatId = id;
            const backBtnHtml = window.innerWidth <= 768 ? '<span class="back-btn" onclick="closeMobileChat()">⬅️</span>' : '';
            const friendData = contactsMap[id];
            const headerAvatar = getAvatarHtml(name, friendData?.avatar, 'sz-sm', `openProfile(${id})`);
            const isOnline = onlineUsersSet.has(String(id));

            // ДОБАВЛЕНА КНОПКА ГАЛЕРЕИ В ШАПКУ
            document.getElementById('chat-with').innerHTML = `${backBtnHtml} <div style="display:flex; align-items:center; gap:10px; flex-grow:1;">${headerAvatar} <span class="status-dot ${isOnline ? 'status-online' : 'status-offline'}" data-userid="${id}"></span> ${name}</div> <span onclick="openMediaGallery()" style="cursor:pointer; font-size:1.2em; color:var(--accent); padding:0 10px;">❯</span>`;

            document.getElementById('chat-area').style.visibility = 'visible';
            const ul = document.getElementById('messages');
            ul.innerHTML = '';
            try {
                const res = await fetch(`/messages?u1=${myId}&u2=${id}`);
                const history = await res.json();
                if (!Array.isArray(history)) return;
                history.forEach(msg => {
                    renderMessage({
                        id: msg.id,
                        userId: msg.sender_id,
                        text: msg.text,
                        type: msg.type,
                        reply_text: msg.reply_text,
                        is_read: msg.is_read,
                        reactions: msg.reactions // ИСПРАВЛЕНИЕ: Теперь мы передаем реакции при загрузке истории!
                    });
                });
            } catch (e) { console.error(e); }
        }

        let toastQueue = [];
        let isToastProcessing = false;
        function showToast(title, text) {
            toastQueue.push({ title, text });
            if (!isToastProcessing) processToastQueue();
        }
        function processToastQueue() {
            if (toastQueue.length === 0) { isToastProcessing = false; return; }
            isToastProcessing = true;
            const data = toastQueue.shift();
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<strong>${data.title}</strong><br><span style="font-size: 0.9em; color: #ccc;">${data.text}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 50);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3000);
            if (toastQueue.length > 0) setTimeout(processToastQueue, 1500);
            else setTimeout(() => { isToastProcessing = false; }, 1500);
        }

        function closeMobileChat() {
            document.getElementById('chat-area').style.visibility = 'hidden';
            currentChatId = null;
        }

        function send() {
            const input = document.getElementById('msg-input');
            if (!input || !currentChatId) return;

            const text = input.value.trim();
            if (text) {
                socket.emit('chat message', {
                    userId: myId,
                    toId: currentChatId,
                    text: text,
                    type: 'text',
                    replyText: window.currentReplyText // Отправляем текст цитаты
                });
                input.value = '';
                cancelReply(); // Прячем панель после отправки
            }
        }

        function renderMessage(data) {
            const isMe = data.userId === myId;
            let senderName = myName;
            let senderAvatarUrl = myAvatar;
            if (!isMe) {
                const friendInfo = contactsMap[data.userId];
                senderName = friendInfo ? friendInfo.name : 'Unknown';
                senderAvatarUrl = friendInfo ? friendInfo.avatar : '';
            }
            const div = document.createElement('div');
            div.className = `msg-container ${isMe ? 'my-msg-container' : ''}`;
            div.dataset.msgId = data.id;
            div.dataset.senderId = data.userId;
            if (!isMe && data.is_read === 0) {
                div.classList.add('unread-msg');
                messageObserver.observe(div);
            }
            const avatarHtml = getAvatarHtml(senderName, senderAvatarUrl, 'sz-sm', `openProfile(${data.userId})`);

            // Обработка времени сообщения
            let timeStr = "";
            if (data.timestamp) {
                let dateObj = new Date(data.timestamp.includes('Z') ? data.timestamp : data.timestamp + "Z");
                if (!isNaN(dateObj)) timeStr = `${dateObj.getHours().toString().padStart(2, '0')}:${dateObj.getMinutes().toString().padStart(2, '0')}`;
            }
            if (!timeStr) {
                let d = new Date();
                timeStr = `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
            }

            let contentHtml = '';
            if (data.reply_text) {
                const safeQuote = data.reply_text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                contentHtml += `<div class="replied-msg-box">${safeQuote}</div>`;
            }
            let rawTextForMenu = "Фотография";
            if (data.type === 'image') {
                // Компактные фото с вызовом полноэкранного окна
                contentHtml += `<img src="${data.text}" class="chat-img" onclick="document.getElementById('photo-viewer-img').src=this.src; document.getElementById('photo-viewer').style.display='flex';">`;
            } else {
                contentHtml += data.text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                rawTextForMenu = data.text;
            }
            const safeText = encodeURIComponent(rawTextForMenu).replace(/'/g, "%27");

            // Сборка сообщения в единую линию, чтобы не было пустых отступов
            div.innerHTML = `
                                ${avatarHtml}
                                <div class="msg ${isMe ? 'my-msg' : ''}">${isMe ? '' : `<strong style="font-size:0.8em; color:var(--accent); display:block; margin-bottom:3px;">${senderName}</strong>`}${contentHtml}<div style="display:flex; justify-content:space-between; align-items:flex-end; margin-top:4px; gap:15px;"><div class="reactions-bar" id="reacts-${data.id}"></div><div style="font-size:0.7em; color:#888; text-align:right; margin-bottom:-4px; white-space:nowrap;">${timeStr}</div></div><div class="msg-dot" onclick="openMsgMenu(event, '${safeText}', ${data.id})">•</div></div>
                            `;
            document.getElementById('messages').appendChild(div);

            // Если с сервера пришли реакции - сразу рисуем их
            if (data.reactions) renderReactions(data.id, data.reactions);

            const obj = document.getElementById('messages');
            obj.scrollTop = obj.scrollHeight;
        }

        document.getElementById('msg-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') send(); });
        const notifySound = new Audio('https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3');

        // --- ЛОГИКА МЕНЮ СООБЩЕНИЙ ---
        function openMsgMenu(event, encodedText) {
            event.stopPropagation();
            window.selectedTextForMenu = decodeURIComponent(encodedText);
            const menu = document.getElementById('msg-context-menu');
            if (!menu) return;

            menu.style.display = 'block';

            let x = event.pageX;
            let y = event.pageY;
            // Чтобы меню не вылезало за край экрана
            if (x + 120 > window.innerWidth) x -= 120;
            if (y + 80 > window.innerHeight) y -= 80;

            menu.style.left = `${x}px`;
            menu.style.top = `${y}px`;
        }

        document.addEventListener('click', () => {
            const menu = document.getElementById('msg-context-menu');
            if (menu) menu.style.display = 'none';
        });

        function triggerReply() {
            window.currentReplyText = window.selectedTextForMenu;
            const previewBar = document.getElementById('reply-preview-bar');
            const previewText = document.getElementById('reply-preview-text');

            if (previewBar && previewText) {
                // Обрезаем длинный текст для превью
                previewText.innerText = window.currentReplyText.length > 40 ? window.currentReplyText.substring(0, 40) + '...' : window.currentReplyText;
                previewBar.style.display = 'flex';
            }
            document.getElementById('msg-input').focus();
        }

        function cancelReply() {
            window.currentReplyText = null;
            const previewBar = document.getElementById('reply-preview-bar');
            if (previewBar) previewBar.style.display = 'none';
        }

        socket.on('chat message', (data) => {
            if (data.userId !== myId && data.toId !== myId) return;
            const isCurrentChat = (data.userId === myId && data.toId === currentChatId) || (data.userId === currentChatId && data.toId === myId);
            if (isCurrentChat) renderMessage(data);
            if (data.toId === myId && data.userId !== myId) {
                if (data.toId === myId && data.userId !== myId) {
                    const friendName = contactsMap[data.userId]?.name || 'User';
                    const msgSnippet = data.type === 'image' ? ' 🖼 ️ Фотография' : data.text;

                    // Если это не открытый чат — считаем непрочитанным
                    if (!isCurrentChat) {
                        unreadCounts[data.userId] = (unreadCounts[data.userId] || 0) + 1;
                        updateUnreadUI(data.userId);
                        showToast(friendName, msgSnippet);
                    }

                    // Уведомление ОС — только когда вкладка скрыта
                    if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
                        const notif = new Notification(`Новое сообщение от ${friendName}`, { body: msgSnippet });
                        setTimeout(() => notif.close(), 5000);
                        notif.onclick = () => { window.focus(); notif.close(); };
                    }

                    if (document.hidden && typeof notifySound !== 'undefined') {
                        notifySound.play().catch(e => console.log("Sound error"));
                    }
                }
            }
        });
        socket.on('initial_online_list', (ids) => {
            ids.forEach(id => updateStatusUI(id, 'online'));
        });

        socket.on('user_status', (data) => {
            updateStatusUI(data.userId, data.status);
        });
        socket.on('contact added', () => loadContacts());
        socket.on('unread_status_data', (data) => {
            unreadCounts = data;
            for (let userId in data) updateUnreadUI(userId);
        });

        socket.on('friend_request', (data) => {
            showToast('Запрос дружбы', `${data.fromName} хочет стать вашим другом`);
            if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
                new Notification('Запрос дружбы', { body: `${data.fromName} хочет добавить вас в друзья` });
            }
            if (typeof notifySound !== 'undefined') notifySound.play().catch(e => console.log(e));

            // Если модалка открыта прямо сейчас - обновляем список или бейдж
            if (document.getElementById('profile-modal').style.display === 'flex') {
                loadFriendRequests();
            }
        });

        // --- ЛОГИКА ВКЛАДОК И ЗАПРОСОВ ---
        function switchTab(tabId) {
            document.getElementById('tab-profile').style.display = tabId === 'profile' ? 'block' : 'none';
            document.getElementById('tab-friends').style.display = tabId === 'friends' ? 'block' : 'none';

            document.getElementById('btn-tab-friends').className = tabId === 'friends' ? 'tab-btn active' : 'tab-btn';

            if (tabId === 'friends') loadFriendRequests();
        }

        function switchTab(tabId) {
            document.getElementById('tab-profile').style.display = tabId === 'profile' ? 'block' : 'none';
            document.getElementById('tab-friends').style.display = tabId === 'friends' ? 'block' : 'none';
            document.getElementById('btn-tab-profile').className = tabId === 'profile' ? 'tab-btn active' : 'tab-btn';
            document.getElementById('btn-tab-friends').className = tabId === 'friends' ? 'tab-btn active' : 'tab-btn';

            if (tabId === 'friends') {
                if (currentProfileEditId === myId) {
                    loadFriendRequests();
                } else {
                    loadMutualFriends(currentProfileEditId);
                }
            }
        }

        function loadMutualFriends(otherUserId) {
            fetch(`/mutual_friends?other_id=${otherUserId}`, { headers: { 'Authorization': localStorage.getItem('net_session_token') } })
                .then(res => res.json())
                .then(friends => {
                    const list = document.getElementById('requests-list');
                    list.innerHTML = '';
                    if (friends.length === 0) {
                        list.innerHTML = '<div style="color:#888; margin-top:20px;">Нет общих друзей</div>';
                        return;
                    }
                    friends.forEach(f => {
                        const avatarSrc = f.avatar ? f.avatar : 'https://via.placeholder.com/40/333/fff?text=' + f.name[0];
                        list.innerHTML += `
                                            <div class="req-item" onclick="openProfile(${f.id})" style="cursor:pointer; justify-content: flex-start; gap: 15px;">
                                                <img src="${avatarSrc}" class="req-avatar">
                                                <div style="font-weight:bold;">${f.name}</div>
                                            </div>
                                        `;
                    });
                })
                .catch(() => showToast('Ошибка', 'Не удалось загрузить друзей'));
        }

        function loadFriendRequests(onlyBadge = false) {
            fetch('/friend_requests', { headers: { 'Authorization': localStorage.getItem('net_session_token') } })
                .then(res => res.json())
                .then(reqs => {
                    const badge = document.getElementById('req-badge');
                    if (reqs.length > 0) {
                        badge.style.display = 'inline-block';
                        badge.innerText = reqs.length;
                    } else {
                        badge.style.display = 'none';
                    }

                    if (onlyBadge) return; // Если просили только обновить бейдж, выходим

                    const list = document.getElementById('requests-list');
                    list.innerHTML = '';
                    if (reqs.length === 0) {
                        list.innerHTML = '<div style="color:#888; margin-top:20px;">Нет новых запросов</div>';
                        return;
                    }

                    reqs.forEach(req => {
                        const avatarSrc = req.avatar ? req.avatar : 'https://via.placeholder.com/40/333/fff?text=' + req.name[0];
                        list.innerHTML += `
                                            <div class="req-item" id="req-${req.req_id}">
                                                <div class="req-info">
                                                    <img src="${avatarSrc}" class="req-avatar">
                                                    <div style="text-align: left;">
                                                        <div style="font-weight:bold;">${req.name}</div>
                                                        <div style="font-size:12px; color:#888;">хочет дружить</div>
                                                    </div>
                                                </div>
                                                <div style="display:flex; gap:5px;">
                                                    <button class="req-btn req-accept" onclick="handleReq(${req.req_id}, 'accept')">✔</button>
                                                    <button class="req-btn req-reject" onclick="handleReq(${req.req_id}, 'reject')">✖</button>
                                                </div>
                                            </div>
                                        `;
                    });
                });
        }

        function handleReq(reqId, action) {
            fetch('/handle_request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': localStorage.getItem('net_session_token') },
                body: JSON.stringify({ req_id: reqId, action })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        loadFriendRequests(); // Перезагружаем список
                        if (action === 'accept') showToast('Система', 'Запрос принят!');
                    }
                });
        }

        // --- РЕАКЦИИ ---
        let contextMsgId = null;

        // Перезаписываем старую функцию меню, чтобы она запоминала ID сообщения
        function openMsgMenu(event, encodedText, msgId) {
            event.stopPropagation();
            window.selectedTextForMenu = decodeURIComponent(encodedText);
            contextMsgId = msgId;
            const menu = document.getElementById('msg-context-menu');
            if (!menu) return;
            menu.style.display = 'block';
            let x = event.pageX; let y = event.pageY;
            if (x + 120 > window.innerWidth) x -= 120;
            if (y + 80 > window.innerHeight) y -= 80;
            menu.style.left = `${x}px`; menu.style.top = `${y}px`;
        }

        function showEmojiPicker(event) {
            event.stopPropagation();
            document.getElementById('msg-context-menu').style.display = 'none';
            const picker = document.getElementById('emoji-picker');
            picker.style.display = 'flex';
            picker.style.left = (event.pageX - 50) + 'px';
            picker.style.top = event.pageY + 'px';
        }

        function sendReaction(emoji, overrideMsgId = null) {
            const id = overrideMsgId || contextMsgId;
            if (id) socket.emit('add_reaction', { msgId: id, emoji: emoji, userId: myId });
            document.getElementById('emoji-picker').style.display = 'none';
        }

        function renderReactions(msgId, reactsObj) {
            const bar = document.getElementById(`reacts-${msgId}`);
            if (!bar) return;
            if (typeof reactsObj === 'string') {
                try { reactsObj = JSON.parse(reactsObj); } catch (e) { reactsObj = {}; }
            }
            const counts = {}; const myReacts = new Set();
            for (let uid in reactsObj) {
                const em = reactsObj[uid];
                counts[em] = (counts[em] || 0) + 1;
                if (String(uid) === String(myId)) myReacts.add(em);
            }
            bar.innerHTML = '';
            for (let em in counts) {
                const isMine = myReacts.has(em);
                bar.innerHTML += `<div class="react-badge ${isMine ? 'my-react' : ''}" onclick="sendReaction('${em}', ${msgId})">${em} ${counts[em]}</div>`;
            }
        }

        document.addEventListener('click', () => {
            const menu = document.getElementById('msg-context-menu');
            const picker = document.getElementById('emoji-picker');
            if (menu) menu.style.display = 'none';
            if (picker) picker.style.display = 'none';
        });

        socket.on('reaction_updated', (data) => renderReactions(data.msgId, data.reacts));

        // --- ЛОГИКА ГАЛЕРЕИ ---
        async function openMediaGallery() {
            if (!currentChatId) return;
            const modal = document.getElementById('media-gallery-modal');
            const grid = document.getElementById('media-gallery-grid');
            grid.innerHTML = '<div style="grid-column: 1 / -1; color: #888;">Загрузка...</div>';
            modal.style.display = 'flex';

            try {
                // Запрашиваем историю чата и фильтруем только фотки
                const res = await fetch(`/messages?u1=${myId}&u2=${currentChatId}`);
                const history = await res.json();
                const photos = history.filter(m => m.type === 'image');

                if (photos.length === 0) {
                    grid.innerHTML = '<div style="grid-column: 1 / -1; color: #888; margin-top: 20px;">В чате отсутствуют фото</div>';
                    return;
                }

                grid.innerHTML = '';
                // Разворачиваем, чтобы новые фото были сверху
                photos.reverse().forEach(msg => {
                    const img = document.createElement('img');
                    img.src = msg.text;
                    img.style.width = '100%';
                    img.style.height = '100px';
                    img.style.objectFit = 'cover';
                    img.style.borderRadius = '8px';
                    img.style.cursor = 'pointer';
                    // При клике на миниатюру - открываем большое фото
                    img.onclick = () => {
                        document.getElementById('photo-viewer-img').src = msg.text;
                        document.getElementById('photo-viewer').style.display = 'flex';
                    };
                    grid.appendChild(img);
                });
            } catch (e) {
                grid.innerHTML = '<div style="grid-column: 1 / -1; color: red;">Ошибка загрузки</div>';
            }
        }
    
    </script>

    <div id="msg-context-menu">
        <div class="msg-menu-item" onclick="triggerReply()">↩ Ответить</div>
        <div class="msg-menu-item" onclick="showEmojiPicker(event)">☻ Реакция</div>
    </div>

    <!-- Панель выбора эмодзи -->
    <div id="emoji-picker" style="display:none; position:fixed; background:#222; border:1px solid #444; border-radius:8px; padding:8px; z-index:1001; gap:8px; font-size:20px; cursor:pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5);">
        <span onclick="sendReaction('👍')">👍</span>
        <span onclick="sendReaction('❤️')">❤️</span>
        <span onclick="sendReaction('😂')">😂</span>
        <span onclick="sendReaction('🔥')">🔥</span>
        <span onclick="sendReaction('😢')">😢</span>
        <span onclick="sendReaction('👎')">👎</span>
    </div>

    <!-- Модалка просмотра фото -->
    <div id="photo-viewer" onclick="this.style.display='none'">
        <img id="photo-viewer-img">
    </div>

    <!-- Модалка галереи чата -->
    <div id="media-gallery-modal" class="modal" style="display: none; background: rgba(0,0,0,0.8); z-index: 600;">
        <div class="auth-box" style="width: 80%; max-width: 600px; height: 80vh; display: flex; flex-direction: column; padding: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin:0;">Фотографии</h2>
                <span onclick="document.getElementById('media-gallery-modal').style.display='none'" style="cursor:pointer; font-size:1.5em; color:#888;">✖</span>
            </div>
            <div id="media-gallery-grid" style="flex-grow: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; align-content: start;">
                <!-- Сюда грузятся фото -->
            </div>
        </div>
    </div>

</body>
</html>
